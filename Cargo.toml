[package]
name = "hyprdmc"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Hypr Dynamic Monitor Configuration: detect, position, rotate and flip Hyprland displays from a CLI or a browser, with automatic hotplug profiles."
authors = ["Jacques Hullu <jacques@hullu.fr>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/jacquesh82/hyprdmc"
homepage = "https://github.com/jacquesh82/hyprdmc"
keywords = ["hyprland", "wayland", "monitor", "display", "hotplug"]
categories = ["command-line-utilities"]
exclude = ["/.github", "/CONTEXT.md", "/CLAUDE.md", "/.dual-graph", "/.claude"]

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.4", features = ["derive"] }
comfy-table = "7.2.2"
rust-embed = { version = "8.12.0", features = ["mime-guess"] }
rust-i18n = "4.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "macros", "time", "signal", "io-util", "sync", "fs"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
toml = "1.1.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
