_version: 2

# Every user-facing string of hyprdmc.
#
# Keys are grouped by the module that emits them. Placeholders use the
# `%{name}` syntax of rust-i18n and must appear in every translation.
#
# Adding a language: add its code to `AVAILABLE` in `src/i18n.rs`, then a line
# under each key here. Missing keys fall back to English.

# ---------------------------------------------------------------- monitors --
monitor.rotation:
  en: "%{degrees}°"
  fr: "%{degrees}°"
monitor.orientation.flipped:
  en: "%{rotation} flipped"
  fr: "%{rotation} inversé"
monitor.invalid_rotation:
  en: "invalid rotation: %{degrees}° (expected 0, 90, 180 or 270)"
  fr: "rotation invalide : %{degrees}° (attendu 0, 90, 180 ou 270)"
monitor.invalid_transform:
  en: "invalid transform: %{value} (expected 0..=7)"
  fr: "transform invalide : %{value} (attendu 0..=7)"
monitor.invalid_mode:
  en: "invalid mode “%{value}” (expected WIDTHxHEIGHT[@RATE])"
  fr: "mode invalide « %{value} » (attendu LARGEURxHAUTEUR[@TAUX])"
monitor.invalid_refresh:
  en: "invalid refresh rate in “%{value}”"
  fr: "taux de rafraîchissement invalide dans « %{value} »"
monitor.invalid_width:
  en: "invalid width in “%{value}”"
  fr: "largeur invalide dans « %{value} »"
monitor.invalid_height:
  en: "invalid height in “%{value}”"
  fr: "hauteur invalide dans « %{value} »"

# ------------------------------------------------------------------ layout --
layout.severity.error:
  en: "error"
  fr: "erreur"
layout.severity.warning:
  en: "warning"
  fr: "attention"
layout.issue.duplicate_output:
  en: "output “%{name}” is defined %{count} times"
  fr: "l'écran « %{name} » est défini %{count} fois"
layout.issue.invalid_scale:
  en: "invalid scale for “%{name}”: %{scale}"
  fr: "échelle invalide pour « %{name} » : %{scale}"
layout.issue.non_integral_scale:
  en: "scale %{scale} yields a non-integral logical size (%{width}x%{height}) on “%{name}”: Hyprland will round it (near %{suggestion})"
  fr: "l'échelle %{scale} donne une taille logique non entière (%{width}x%{height}) pour « %{name} » : Hyprland l'ajustera (autour de %{suggestion})"
layout.issue.mirror_missing:
  en: "“%{name}” mirrors “%{target}”, which does not exist"
  fr: "« %{name} » duplique « %{target} », qui n'existe pas"
layout.issue.mirror_disabled:
  en: "“%{name}” mirrors “%{target}”, which is disabled"
  fr: "« %{name} » duplique « %{target} », qui est désactivé"
layout.issue.overlap:
  en: "“%{a}” and “%{b}” overlap"
  fr: "« %{a} » et « %{b} » se chevauchent"
layout.issue.unreachable:
  en: "“%{name}” touches no other output: the cursor will not be able to reach it"
  fr: "« %{name} » ne touche aucun autre écran : le curseur ne pourra pas y accéder"
layout.issue.all_disabled:
  en: "every output would be disabled"
  fr: "tous les écrans seraient désactivés"
layout.unknown_anchor:
  en: "unknown reference output “%{name}”"
  fr: "écran de référence « %{name} » inconnu"
layout.unknown_output:
  en: "unknown output “%{name}”"
  fr: "écran « %{name} » inconnu"
layout.self_reference:
  en: "“%{name}” cannot be positioned relative to itself"
  fr: "« %{name} » ne peut pas être positionné par rapport à lui-même"
layout.unknown_relation:
  en: "unknown relation “%{value}” (expected left-of, right-of, above, below, same-as)"
  fr: "relation inconnue « %{value} » (attendu left-of, right-of, above, below, same-as)"

# ------------------------------------------------------------------- apply --
apply.drift.vanished:
  en: "“%{name}” disappeared from the output list"
  fr: "« %{name} » a disparu de la liste des écrans"
apply.drift.enabled_mismatch:
  en: "“%{name}” should be %{wanted} but is %{got}"
  fr: "« %{name} » devrait être %{wanted} mais est %{got}"
apply.state.enabled:
  en: "enabled"
  fr: "activé"
apply.state.disabled:
  en: "disabled"
  fr: "désactivé"
apply.drift.mode_refused:
  en: "mode refused on “%{name}”: asked %{wanted}, got %{got}"
  fr: "mode refusé pour « %{name} » : %{wanted} demandé, %{got} obtenu"
apply.drift.refresh_adjusted:
  en: "refresh rate adjusted on “%{name}”: asked %{wanted} Hz, got %{got} Hz"
  fr: "taux de rafraîchissement ajusté sur « %{name} » : %{wanted} Hz demandé, %{got} Hz obtenu"
apply.drift.position_refused:
  en: "position refused on “%{name}”: asked %{wanted}, got %{got}"
  fr: "position refusée pour « %{name} » : %{wanted} demandé, %{got} obtenu"
apply.drift.transform_refused:
  en: "orientation refused on “%{name}”: asked %{wanted}, got %{got}"
  fr: "orientation refusée pour « %{name} » : %{wanted} demandé, %{got} obtenu"
apply.drift.scale_adjusted:
  en: "scale adjusted by Hyprland on “%{name}”: asked %{wanted}, applied %{got}"
  fr: "échelle ajustée par Hyprland sur « %{name} » : %{wanted} demandé, %{got} appliqué"
apply.drift.mirror_mismatch:
  en: "mirroring mismatch on “%{name}”: asked %{wanted}, got %{got}"
  fr: "duplication non conforme sur « %{name} » : %{wanted} demandé, %{got} obtenu"
apply.mirror.none:
  en: "none"
  fr: "aucune"
apply.rejected:
  en: "layout rejected:\n%{issues}\n(use --force to apply anyway)"
  fr: "agencement refusé :\n%{issues}\n(utilisez --force pour passer outre)"
apply.confirm_prompt:
  en: "Keep this configuration? [y/N] (automatic revert in %{seconds}s) "
  fr: "Conserver cette configuration ? [o/N] (retour arrière automatique dans %{seconds} s) "
apply.reverted:
  en: "Reverted to the previous configuration."
  fr: "Retour à la configuration précédente."
apply.not_applied:
  en: "configuration not applied: the previous state has been restored"
  fr: "configuration non appliquée : l'état précédent a été restauré"

# --------------------------------------------------------------------- ipc --
ipc.rejected:
  en: "Hyprland rejected the configuration: %{message}\ncommands sent:\n  %{commands}"
  fr: "Hyprland a rejeté la configuration : %{message}\ncommandes envoyées :\n  %{commands}"
ipc.unreachable:
  en: "Hyprland does not seem to be reachable"
  fr: "Hyprland ne semble pas accessible"
ipc.not_running:
  en: "Hyprland does not seem to be running: %{path} not found"
  fr: "Hyprland ne semble pas tourner : %{path} introuvable"
ipc.no_instance:
  en: "no Hyprland instance found in %{path}"
  fr: "aucune instance Hyprland trouvée dans %{path}"
ipc.many_instances:
