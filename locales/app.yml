# ------------------------------------------------------------------ emit ----
# These carry no comment marker: `emit::commented` adds the one the active
# compositor plugin uses (`--` for Lua, `#` for sway), so one translation serves
# every syntax.
emit.header:
  en: |
    Generated by hyprdmc — DO NOT EDIT BY HAND.
    Rewritten on every `hyprdmc persist` or profile application.
    To change the layout: `hyprdmc set`, `hyprdmc arrange`, or the web interface.
  fr: |
    Généré par hyprdmc — NE PAS ÉDITER À LA MAIN.
    Réécrit à chaque `hyprdmc persist` ou application de profil.
    Pour modifier l'agencement : « hyprdmc set », « hyprdmc arrange », ou l'interface web.
emit.primary_comment:
  en: "main screen: %{name} (the output at 0x0 below)"
  fr: "écran principal : %{name} (l'écran en 0x0 ci-dessous)"
emit.adopted_comment:
  en: "adopted by hyprdmc -> %{target}"
  fr: "repris par hyprdmc -> %{target}"
emit.input_header:
  en: |
    Generated by hyprdmc — DO NOT EDIT BY HAND.
    Keyboard and pointer only: the screens live in the generated monitor file.
    To change these settings: the web interface, "Keyboard & pointer" tab.
  fr: |
    Généré par hyprdmc — NE PAS ÉDITER À LA MAIN.
    Clavier et pointeur uniquement : les écrans sont dans le fichier généré des écrans.
    Pour modifier ces réglages : l'interface web, onglet « Clavier et pointeur ».

