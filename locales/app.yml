  fr: "%{count} instances Hyprland trouvées dans %{path} — définissez HYPRLAND_INSTANCE_SIGNATURE"
ipc.stale_signature:
  en: "HYPRLAND_INSTANCE_SIGNATURE is “%{signature}” but %{path} does not exist"
  fr: "HYPRLAND_INSTANCE_SIGNATURE vaut « %{signature} » mais %{path} n'existe pas"

ipc.unexpected_response:
  en: "unexpected JSON response from Hyprland: %{body}"
  fr: "réponse JSON inattendue de Hyprland : %{body}"
ipc.send_failed:
  en: "could not send “%{cmd}”"
  fr: "envoi de « %{cmd} » impossible"
ipc.read_failed:
  en: "could not read the response to “%{cmd}”"
  fr: "lecture de la réponse à « %{cmd} » impossible"
ipc.invalid_utf8:
  en: "non-UTF8 response from Hyprland: %{error}"
  fr: "réponse non-UTF8 de Hyprland : %{error}"

# ----------------------------------------------------------------- files ----
fs.create_dir_failed:
  en: "could not create %{path}"
  fr: "création de %{path} impossible"
fs.read_failed:
  en: "could not read %{path}"
  fr: "lecture de %{path} impossible"
fs.write_failed:
  en: "could not write to %{path}"
  fr: "écriture dans %{path} impossible"
fs.rename_failed:
  en: "could not replace %{path}"
  fr: "remplacement de %{path} impossible"
fs.backup_failed:
  en: "could not back up to %{path}"
  fr: "sauvegarde vers %{path} impossible"

# ------------------------------------------------------------------ emit ----
emit.header:
  en: |
    # Generated by hyprdmc — DO NOT EDIT BY HAND.
    # Rewritten on every `hyprdmc persist` or profile application.
    # To change the layout: `hyprdmc set`, `hyprdmc arrange`, or the web interface.
  fr: |
    # Généré par hyprdmc — NE PAS ÉDITER À LA MAIN.
    # Réécrit à chaque `hyprdmc persist` ou application de profil.
    # Pour modifier l'agencement : `hyprdmc set`, `hyprdmc arrange`, ou l'interface web.
emit.adopted_comment:
  en: "# adopted by hyprdmc -> %{target}"
  fr: "# repris par hyprdmc -> %{target}"

