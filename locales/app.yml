_version: 2

# Every user-facing string of hyprdmc.
#
# Keys are grouped by the module that emits them. Placeholders use the
# `%{name}` syntax of rust-i18n and must appear in every translation.
#
# Adding a language: add its code to `AVAILABLE` in `src/i18n.rs`, then a line
# under each key here. Missing keys fall back to English.

# ---------------------------------------------------------------- monitors --
monitor.rotation:
  en: "%{degrees}°"
  fr: "%{degrees}°"
monitor.orientation.flipped:
  en: "%{rotation} flipped"
  fr: "%{rotation} inversé"
monitor.invalid_rotation:
  en: "invalid rotation: %{degrees}° (expected 0, 90, 180 or 270)"
  fr: "rotation invalide : %{degrees}° (attendu 0, 90, 180 ou 270)"
monitor.invalid_transform:
  en: "invalid transform: %{value} (expected 0..=7)"
  fr: "transform invalide : %{value} (attendu 0..=7)"
monitor.invalid_mode:
  en: "invalid mode “%{value}” (expected WIDTHxHEIGHT[@RATE])"
  fr: "mode invalide « %{value} » (attendu LARGEURxHAUTEUR[@TAUX])"
monitor.invalid_refresh:
  en: "invalid refresh rate in “%{value}”"
  fr: "taux de rafraîchissement invalide dans « %{value} »"
monitor.invalid_width:
  en: "invalid width in “%{value}”"
  fr: "largeur invalide dans « %{value} »"
monitor.invalid_height:
  en: "invalid height in “%{value}”"
  fr: "hauteur invalide dans « %{value} »"

