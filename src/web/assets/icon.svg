<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="hyprdmc">
  <!--
    Two displays, one landscape and one rotated to portrait, overlapping the
    way they do on the arrangement canvas — the tool's whole subject in one
    glyph. Drawn with currentColor-independent gradients so it reads on both
    light and dark backgrounds, and legible down to 16px: no stroke thinner
    than 2 units, no detail smaller than 4.
  -->
  <defs>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cc4f8"/>
      <stop offset="1" stop-color="#3d7fc1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f0b45e"/>
      <stop offset="1" stop-color="#e0854a"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="13" fill="#1b1f27"/>

  <!-- Landscape display, the reference one. -->
  <rect x="9" y="16" width="34" height="23" rx="3" fill="url(#primary)"/>
  <rect x="13" y="20" width="26" height="15" rx="1.5" fill="#1b1f27" opacity=".38"/>
  <!-- Its stand, so the shape reads as a screen and not as a window. -->
  <path d="M22 39h8v5h5v3H17v-3h5z" fill="url(#primary)" opacity=".85"/>

  <!-- Portrait display: the rotation the tool exists to configure. -->
  <rect x="40" y="9" width="16" height="34" rx="3" fill="url(#accent)"/>
  <rect x="43" y="13" width="10" height="26" rx="1.5" fill="#1b1f27" opacity=".38"/>
  <path d="M44 43h8v4h4v3H40v-3h4z" fill="url(#accent)" opacity=".85"/>
</svg>
